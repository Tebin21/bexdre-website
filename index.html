<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Self-hosted brand font: discovered early (before CSSOM parse reaches the
         @font-face rule) so 'font-display: optional' actually has a chance to pick
         it up on first paint instead of silently falling back every time. Bold is
         preloaded first since it's the H1 weight and the likely LCP element. -->
    <link rel="preload" href="/fonts/baticasans-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/baticasans-regular.woff2" as="font" type="font/woff2" crossorigin />

    <!-- SEO -->
    <title>BEXDRE — Build. Engineer. eXperience. Develop. Revolutionize. Empower.</title>
    <meta
      name="description"
      content="BEXDRE is a premium technology agency specializing in custom software, mobile apps, enterprise systems, and digital experiences that transform businesses."
    />
    <meta name="keywords" content="BEXDRE, software agency, web development, mobile apps, enterprise systems, digital agency, React, TypeScript" />
    <meta name="author" content="BEXDRE" />
    <link rel="canonical" href="https://bexdre.com" />

    <!-- Open Graph -->
    <meta property="og:title" content="BEXDRE — Premium Technology Agency" />
    <meta property="og:description" content="Build. Engineer. eXperience. Develop. Revolutionize. Empower. — Premium digital products delivered with precision." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bexdre.com" />
    <meta property="og:image" content="https://bexdre.com/images/bexdrelogo-opt.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BEXDRE — Premium Technology Agency" />
    <meta name="twitter:description" content="Premium digital products delivered with precision." />
    <meta name="twitter:image" content="https://bexdre.com/images/bexdrelogo-opt.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#05070A" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
